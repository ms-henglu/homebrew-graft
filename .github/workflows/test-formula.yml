name: Test Homebrew Formula

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/test-formula.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/test-formula.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            name: macOS (Apple Silicon)
          - os: macos-15-large
            arch: x86_64
            name: macOS (Intel)
          - os: ubuntu-latest
            arch: x86_64
            name: Linux (x86_64)
          - os: ubuntu-24.04-arm
            arch: arm64
            name: Linux (arm64)

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Checkout
        uses: actions/checkout@v4

      - name: Tap local repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/ms-henglu"
          ln -sf "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/ms-henglu/homebrew-graft"

      - name: Install formula
        run: |
          brew install --verbose ms-henglu/graft/graft

      - name: Verify installation
        run: |
          graft --version
          which graft

      - name: Run brew test
        run: |
          brew test ms-henglu/graft/graft
